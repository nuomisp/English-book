services:
  reminders:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - reminder-data:/data
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  reminder-data:
